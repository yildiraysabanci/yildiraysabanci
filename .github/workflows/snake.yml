# Redraws the contribution graph as a snake animation and publishes the SVGs
# on the `output` branch, which README.md embeds. Runs nightly, on every push
# to main, and on demand (Actions tab -> Run workflow).
name: Contribution snake

on:
  schedule:
    - cron: "23 3 * * *"   # 06:23 Europe/Istanbul
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: yildiraysabanci
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
